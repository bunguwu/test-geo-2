<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<title>GeoFolio</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D47A1"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600&family=Fraunces:wght@600&display=swap">
<style>
:root{--bg:#E3F2FD;--card:#fff;--ink:#0a2540;--mut:#4a6785;--pri:#0D47A1;--acc:#2196F3;--hi:#90CAF9;--line:#b9dcf7;--on:#fff;--bad:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}

@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#071a33;--card:#0f2a4d;--ink:#e3f2fd;--mut:#9cc3e6;--pri:#90CAF9;--acc:#2196F3;--hi:#16407a;--line:#1d4577;--on:#071a33;--bad:#ff9a8f;color-scheme:dark}body::before{content:"";position:fixed;inset:0;background:rgba(7,26,51,.85);z-index:-1}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg) url(background.jpg) center/cover fixed no-repeat;color:var(--ink);font:15px/1.55 "Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3{font-family:"Fraunces",Georgia,"Times New Roman",serif;margin:.2em 0 .4em;line-height:1.2}
h1{font-size:30px}
.auth{max-width:480px;margin:5vh auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin:0 0 16px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.btn,.tabs button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 14px;cursor:pointer;font:inherit}
.tabs .on,.btn.p{background:var(--pri);color:var(--on);border-color:var(--pri)}
.btn.d{color:var(--bad)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input,select,textarea{width:100%;padding:9px 11px;margin:4px 0 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
label{font-size:13px;color:var(--mut);display:block}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
nav{background:var(--pri);color:var(--on);padding:18px 12px;position:sticky;top:0;align-self:start;height:100vh}
nav button{display:block;width:100%;text-align:left;background:none;border:0;color:inherit;padding:10px 12px;border-radius:8px;cursor:pointer;font:inherit;opacity:.8}
nav button.on{background:rgba(255,255,255,.2);opacity:1}
main{padding:24px;min-width:0;max-width:980px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.big{font:600 32px "Fraunces",Georgia,serif;color:var(--pri)}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin-bottom:12px}.bar i{display:block;height:100%;background:var(--acc)}
.mut{color:var(--mut);font-size:13px}.tag{background:var(--hi);color:var(--ink);border-radius:6px;padding:1px 8px;font-size:12px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:560px}td,th{border:1px solid var(--line);padding:8px;text-align:left;font-size:13px}
fieldset.share{border:1px solid var(--line);border-radius:8px;margin:0 0 10px;padding:6px 12px 8px}legend{font-size:13px;color:var(--mut);padding:0 4px}.ck{display:flex;align-items:center;gap:8px;color:var(--ink);font-size:14px;padding:4px 0}.ck input{width:auto;margin:0}
.err{color:var(--bad)}.good{color:var(--pri)}
.top{display:flex;align-items:center;gap:12px;padding:14px 24px;background:var(--pri);color:var(--on)}.top .mut{color:inherit;opacity:.85;display:block}.bn{font:600 22px "Fraunces",Georgia,serif}
.land{display:grid;grid-template-columns:1fr minmax(300px,480px) 1fr;gap:20px;max-width:1180px;margin:4vh auto;padding:0 16px;align-items:start}
.slot{min-height:260px;border:2px dashed var(--acc);border-radius:14px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--mut);padding:12px}.slot.wide{grid-column:1/-1;min-height:90px}
.roles{display:grid;gap:10px;margin-top:10px}.role{text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:14px 16px;cursor:pointer;font:inherit;display:flex;flex-direction:column;gap:2px}.role:hover{border-color:var(--acc);box-shadow:0 0 0 3px var(--hi)}
fieldset.share{border:1px solid var(--line);border-radius:8px;margin:0 0 10px;padding:6px 12px 8px}legend{font-size:13px;color:var(--mut);padding:0 4px}.ck{display:flex;align-items:center;gap:8px;color:var(--ink);font-size:14px;padding:4px 0}.ck input{width:auto;margin:0}
iframe{width:100%;height:220px;border:0;border-radius:10px;margin:8px 0}.pic{max-width:100%;max-height:260px;border-radius:10px;display:block;margin:8px 0}
@media(max-width:760px){body{background-attachment:scroll}}
@media(max-width:860px){.land{grid-template-columns:1fr}.slot{display:none}}hr{border:0;border-top:1px solid var(--line);margin:12px 0}
.mbar{display:none}
@media(max-width:760px){.app{display:block}.mbar{display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20;background:var(--pri);color:var(--on);padding:10px 14px}.mbar b{font:600 18px "Fraunces",Georgia,serif}.burger{background:none;border:1px solid currentColor;color:inherit;border-radius:8px;font-size:22px;line-height:1;padding:4px 12px;cursor:pointer}nav{display:none;height:auto;position:static;padding:8px}nav.open{display:block}.brand{display:none}}
</style></head>
<body><div id="app"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="app.js?v=7"></script></body></html>
